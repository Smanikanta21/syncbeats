version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: syncbeats-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - syncbeats-network

  prisma:
    image: node:20-alpine
    container_name: syncbeats-prisma
    working_dir: /workspace/syncbeats-server
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - ./:/workspace
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      npx --no-install prisma generate &&
      npx --no-install prisma db push
      "
    networks:
      - syncbeats-network

  server:
    container_name: syncbeats-server
    build:
      context: ./syncbeats-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
      prisma:
        condition: service_completed_successfully
    networks:
      - syncbeats-network

  frontend:
    container_name: syncbeats-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - server
    networks:
      - syncbeats-network

volumes:
  pgdata:

networks:
  syncbeats-network:
    driver: bridge