services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncbeats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncbeats_secret}
      POSTGRES_DB: ${POSTGRES_DB:-syncbeats}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syncbeats} -d $${POSTGRES_DB:-syncbeats}"]
      interval: 5s
      timeout: 3s
      retries: 20

  prisma:
    image: node:20-alpine
    working_dir: /workspace/syncbeats-server
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://syncbeats:syncbeats_secret@db:5432/syncbeats}
    volumes:
      - ./:/workspace
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx --no-install prisma generate &&
      npx --no-install prisma db push --accept-data-loss"
    restart: "no"

  server:
    build:
      context: ./syncbeats-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://syncbeats:syncbeats_secret@db:5432/syncbeats}
      JWT_SECRET: ${JWT_SECRET:-syncbeats-dev-jwt-secret-change-in-prod}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      prisma:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
