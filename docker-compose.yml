services:
  server:
    build:
      context: ./syncbeats-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      # Neon pooled connection string (runtime queries)
      DATABASE_URL: ${DATABASE_URL:?Set Neon pooled DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-syncbeats-dev-jwt-secret-change-in-prod}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?Set RESEND_FROM_EMAIL}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads: