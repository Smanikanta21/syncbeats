services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/smanikanta21/syncbeats-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_PUBLIC_APP_URL: ${AUTH_PUBLIC_APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_FROM_EMAIL: ${AUTH_FROM_EMAIL}
      CAMPAIGN_FROM_EMAIL: ${CAMPAIGN_FROM_EMAIL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - uploads:/app/uploads

  studio:
    image: ghcr.io/smanikanta21/syncbeats-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: npx prisma studio --hostname 0.0.0.0 --port 5555
    ports:
      - "5555:5555"
    profiles:
      - admin

volumes:
  pgdata:
  uploads: