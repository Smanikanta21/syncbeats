<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for icon -->
  <defs>
    <linearGradient id="beatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="128" cy="128" r="120" fill="url(#beatGradient)" opacity="0.1"/>
  
  <!-- Left musical note -->
  <g transform="translate(70, 95)">
    <!-- Note stem -->
    <rect x="6" y="0" width="3" height="50" fill="#6366f1" rx="1.5"/>
    <!-- Note head -->
    <ellipse cx="7.5" cy="55" rx="10" ry="8" fill="#6366f1" transform="rotate(-20 7.5 55)"/>
  </g>
  
  <!-- Right musical note -->
  <g transform="translate(155, 80)">
    <!-- Note stem -->
    <rect x="6" y="0" width="3" height="65" fill="#8b5cf6" rx="1.5"/>
    <!-- Note head -->
    <ellipse cx="7.5" cy="70" rx="10" ry="8" fill="#8b5cf6" transform="rotate(-20 7.5 70)"/>
  </g>
  
  <!-- Center sync circle with arrows -->
  <g transform="translate(128, 128)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
    
    <!-- Sync arrows forming a circle -->
    <!-- Top right arrow -->
    <path d="M 20,-15 L 25,-8 L 18,-5" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 5,-25 Q 20,-30 25,-20" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Bottom left arrow -->
    <path d="M -20,15 L -25,8 L -18,5" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -5,25 Q -20,30 -25,20" fill="none" stroke="#8b5cf6" stroke-width="2 stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Decorative dots representing devices -->
  <circle cx="80" cy="170" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="128" cy="185" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="176" cy="170" r="4" fill="#6366f1" opacity="0.6"/>
</svg>