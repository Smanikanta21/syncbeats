<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vinylGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </radialGradient>
    <radialGradient id="whiteDisc" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Vinyl disc outer edge (dark groove) -->
  <circle cx="128" cy="128" r="116" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/>
  
  <!-- Vinyl grooves (rings) -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.6"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.5"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.4"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.2"/>
  
  <!-- Main vinyl groove pattern -->
  <circle cx="128" cy="128" r="105" fill="none" stroke="#1f1f1f" stroke-width="2" opacity="0.8"/>
  <circle cx="128" cy="128" r="85" fill="none" stroke="#1f1f1f" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Center WHITE CIRCLE (stroke only, not filled) -->
  <circle cx="128" cy="128" r="28" fill="none" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Center spindle hole -->
  <circle cx="128" cy="128" r="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5"/>
  
  <!-- Sync pulse effect (subtle glow) -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
</svg>