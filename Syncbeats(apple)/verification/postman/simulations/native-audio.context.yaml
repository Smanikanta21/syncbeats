purpose:
  stands_in_for: Downloaded audio responses, including synthetic WAV, malformed data and HTTP 503.
  unblocks: Native AVAudioEngine preparation and authoritative room playback/readiness recovery.
assumptions:
  - id: local-native-audio-and-room-recovery
    status: supported
    claim: The native client renders the synthetic audio and preserves server readiness across loaded snapshots, pause and reconnect in the exercised local room.
    reason: Real URLSession and AVAudioEngine ran against the audio fixture, and real Socket.IO traffic used the production backend Room state object.
    verification: On 2026-11-19, 41 checks passed with native-playback-room.cjs on port 4190 forwarding downloads to the simulation on port 4189. Loaded players remained ready and unblocked after snapshots settled, on pause and after reconnect. Failure/retry, seek, timing probes and stereo energy checks also passed. Real YouTube extraction, authenticated persistence, hardware latency and audible multi-device synchronization were not exercised.
    source: NativeAudioVerification.swift; native-playback-room.cjs; NativeRoomAudio.swift; RoomSession.swift; /tmp/syncbeats-push-native-playback-checks.log; /tmp/syncbeats-push-native-audio.ndjson. Earlier evidence remains in native-audio.context.md.
    updated_at: "2026-11-19"
  - id: native-audio-account-library-push-review
    status: supported
    claim: The native audio client preserves preparation, duration, scheduled playback, seek and failure recovery while compact spectrum bars use measured audio in the exercised local scenarios.
    reason: The real Swift caller and AVAudioEngine completed 40 checks against the existing repository audio fixture, including valid audio, HTTP 503 and malformed audio.
    verification: On 2026-11-21, 40 native audio checks passed. The simulation recorded four download requests with three HTTP 200 responses and one HTTP 503; the successful responses included a deliberately malformed payload. Compact FFT bars, equalizer rendering, stereo energy and ambient geometry passed. Live YouTube extraction, authenticated room playback and multi-device hardware latency were not exercised in this run.
    source: NativeAudioVerification.swift; postman/mocks/native-audio/default.js; ../Syncbeats/Syncbeats/Services/Audio/NativeRoomAudio.swift; ../Syncbeats/Syncbeats/Services/Audio/SpectrumMotion.swift; /tmp/syncbeats-push-native-audio-final.log; /tmp/syncbeats-push-audio-sim.ndjson
    updated_at: "2026-11-21"
  - id: mobile-local-interruption-and-recovery
    status: supported
    claim: In the exercised local room, suspended output stays silent while room time advances, and recovery follows the current authoritative timeline.
    reason: The real Swift client, AVAudioEngine and Socket.IO client completed interruption and graph-reconstruction scenarios against the existing synthetic audio and production backend Room fixture.
    verification: On 2026-11-21, 62 native audio checks passed, including suspension across drift ticks, explicit Play without toggling an already-playing room, resumed position alignment, rebuilt audio objects, and respecting a room pause during interruption. These ran on the Mac host. Actual iOS call notifications, headphones, remote-command UI, MusicKit, Google credentials and hardware synchronization remain unverified.
    source: NativeAudioVerification.swift; native-playback-room.cjs; ../Syncbeats/Syncbeats/Services/Audio/NativeRoomAudio.swift; ../Syncbeats/Syncbeats/Features/Room/RoomSession.swift; /tmp/syncbeats-mobile-audio-checks.log; /tmp/syncbeats-mobile-audio-sim.ndjson
    updated_at: "2026-11-21"
  - id: native-delayed-render-timing
    status: supported
    claim: With the existing synthetic downloaded audio, steady sample playback avoids repeated corrections and a delayed correction preserves the expected timeline.
    reason: The real AVAudioEngine caller passed checks against a monotonic timeline and a fade with 120 ms of deliberately delayed actor delivery; the correction used elapsed time and rendered nonzero audio after fading back in.
    verification: On 2026-11-21, 65 native audio checks passed against the existing Postman audio simulation on port 4189 and production Room fixture on port 4190. The simulation recorded successful downloads, HTTP 503 and malformed audio, and the real caller verified their outcomes. Signed iPhone and iPad builds passed and were installed. This Mac-host run does not establish glitch-free playback while physical screens are locked; the user reported occasional built-in-speaker glitches on the prior mobile build, and the revised build awaits a locked-screen retest.
    source: NativeAudioVerification.swift; ../Syncbeats/Syncbeats/Services/Audio/NativeRoomAudio.swift; /tmp/syncbeats-locked-audio-checks.log; /tmp/syncbeats-locked-audio-sim.ndjson
    updated_at: "2026-11-21"
