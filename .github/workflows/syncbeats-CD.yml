name: Syncbeats CD (VM Deployment)

on:
  push:
    branches: [main, nodejs-dev]
    paths:
      - 'dev/syncbeats-server/**'
      - '.github/workflows/syncbeats-CD.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: sync-beats-472708
  ZONE: us-central1-f
  VM_NAME: syncbeats-vm

jobs:
  test-backend:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp binary
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: ./dev/syncbeats-server
        run: |
          npm ci
          DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate

      - name: Execute Backend Tests
        working-directory: ./dev/syncbeats-server
        run: npm test

  deploy:
    name: Build & Deploy to VM
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation
      packages: write   # Required to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dev/syncbeats-server
          push: true
          tags: |
            ghcr.io/smanikanta21/syncbeats-server:latest
            ghcr.io/smanikanta21/syncbeats-server:${{ github.sha }}

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create and Sync .env
        env:
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          PORT: 4000
          POSTGRES_USER: syncbeats
          POSTGRES_PASSWORD: syncbeats
          POSTGRES_DB: syncbeats
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://syncbeats.in' }}
          BACKEND_URL: 'https://api.syncbeats.in'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_KEYS: ${{ secrets.RAPID_API_KEYS }}
          AUTH_FROM_EMAIL: ${{ vars.AUTH_FROM_EMAIL || 'auth@syncbeats.in' }}
          UPDATES_FROM_EMAIL: ${{ vars.UPDATES_FROM_EMAIL || 'updates@syncbeats.in' }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD || 'syncbeatsadmin' }}
        run: |
          cat <<EOF > .env.vm
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          FRONTEND_URL=$FRONTEND_URL
          BACKEND_URL=$BACKEND_URL
          JWT_SECRET=$JWT_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET
          RESEND_API_KEY=$RESEND_API_KEY
          RAPID_API_KEY=$RAPID_API_KEY
          RAPID_API_KEYS=$RAPID_API_KEYS
          AUTH_FROM_EMAIL=$AUTH_FROM_EMAIL
          UPDATES_FROM_EMAIL=$UPDATES_FROM_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          EOF
          gcloud compute scp .env.vm ${{ env.VM_NAME }}:~/.env --zone ${{ env.ZONE }} --quiet

      - name: Deploy to VM via SSH
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone ${{ env.ZONE }} --quiet --command="sudo docker compose pull server && sudo docker compose up -d server"