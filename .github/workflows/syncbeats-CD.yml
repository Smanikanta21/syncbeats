name: Syncbeats CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smanikanta21/syncbeats-server

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build backend Docker image
  # Runs on GitHub's free runner (7GB RAM)
  # ─────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write           # needed to push to GHCR

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short   # e.g. ghcr.io/you/syncbeats-server:a1b2c3d
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./syncbeats-server   # path to your backend Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Cache layers between runs — dramatically speeds up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2 — Build Next.js frontend
  # Runs on GitHub's free runner (7GB RAM)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: npm run build

      # Package the build output to transfer to EC2
      # .next/standalone + .next/static + public is all you need
      - name: Package build output
        run: tar -czf frontend-build.tar.gz -C frontend .next public package.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy to EC2
  # Waits for both builds. EC2 does almost nothing.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, build-frontend]   # only runs if both succeed

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      # ── Download the frontend build from Job 2 ──
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      # ── SCP the pre-built frontend to EC2 ──
      # EC2 doesn't build anything — just receives a tarball
      - name: Upload frontend build to EC2
        run: |
          scp -o StrictHostKeyChecking=yes \
            frontend-build.tar.gz \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/frontend-build.tar.gz

      # ── Everything below is lightweight on EC2 ──
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"
            SERVER="$APP/syncbeats-server"

            # Always run docker compose from APP dir
            # Define a helper so we never forget
            dc() { docker compose --project-directory "$APP" "$@"; }

            cd "$APP"
            git fetch origin
            git reset --hard origin/main

            # ── BACKEND ──────────────────────────────────────
            dc down --remove-orphans || true

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Run migrations
            dc run --rm server npx prisma migrate deploy

            # Start backend
            dc up -d server

            # Give it 3s then immediately dump logs — don't wait silently
            sleep 3
            echo "=== SERVER LOGS ==="
            dc logs --tail 50 server
            echo "=== CONTAINER STATUS ==="
            dc ps

            # Health check
            sleep 5
            curl -fsS http://localhost:4000/health >/dev/null
            echo "Backend healthy"

            # ── FRONTEND ─────────────────────────────────────
            pm2 delete syncbeats-frontend || true

            # Stay in FRONT only for the frontend steps
            cd "$FRONT"
            rm -rf .next public
            tar -xzf "$APP/frontend-build.tar.gz"
            rm "$APP/frontend-build.tar.gz"

            pm2 start "node .next/standalone/server.js" \
              --name syncbeats-frontend \
              --env PORT=3000
            pm2 save

            sleep 5
            curl -fsS http://localhost:3000 >/dev/null
            echo "Frontend healthy"

            # ── NGINX ─────────────────────────────────────────
            sudo nginx -t
            sudo systemctl reload nginx

            # ── FINAL STATUS — always from APP dir ───────────
            cd "$APP"
            echo "=== FINAL DOCKER STATUS ==="
            dc ps
            echo "=== FINAL SERVER LOGS ==="
            dc logs --tail 20 server
            echo "=== PM2 STATUS ==="
            pm2 ps

            echo "Deploy complete"
          EOF