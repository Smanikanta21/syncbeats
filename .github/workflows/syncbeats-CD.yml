name: Syncbeats CD

on:
  push:
    branches: [main, nodejs-dev]
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: smanikanta21/syncbeats-server
  FRONTEND_IMAGE: smanikanta21/syncbeats-frontend

jobs:

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v5
        with:
          context: ./syncbeats-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provision-env:
    name: Provision .env on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env and SCP to EC2
        env:
          V_NODE_ENV:              ${{ vars.NODE_ENV }}
          V_PORT:                  ${{ vars.PORT }}
          V_STUDIO_PORT:           ${{ vars.STUDIO_PORT }}
          V_FRONTEND_PORT:         ${{ vars.FRONTEND_PORT }}
          V_POSTGRES_USER:         ${{ vars.POSTGRES_USER }}
          V_POSTGRES_PASSWORD:     ${{ secrets.POSTGRES_PASSWORD }}
          V_POSTGRES_DB:           ${{ vars.POSTGRES_DB }}
          V_JWT_SECRET:            ${{ secrets.JWT_SECRET }}
          V_GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
          V_FRONTEND_URL:          ${{ vars.FRONTEND_URL }}
          V_AUTH_FROM_EMAIL:       ${{ vars.AUTH_FROM_EMAIL }}
          V_RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          V_NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
          V_AWS_REGION:            ${{ vars.AWS_REGION }}
          V_AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          V_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          V_S3_BUCKET_NAME:        ${{ vars.S3_BUCKET_NAME }}
          V_CDN_DOMAIN:            ${{ vars.CDN_DOMAIN }}
        run: |
          APP_DIR="sync-beats"
          DB_HOST="postgres"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP_DIR="sync-beats-dev"
            DB_HOST="${{ secrets.VM_HOST }}"
          fi

          {
            echo "NODE_ENV=${V_NODE_ENV}"
            echo "PORT=${V_PORT}"
            echo "STUDIO_PORT=${V_STUDIO_PORT}"
            echo "FRONTEND_PORT=${V_FRONTEND_PORT}"
            echo "POSTGRES_USER=${V_POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${V_POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${V_POSTGRES_DB}"
            echo "DATABASE_URL=postgresql://${V_POSTGRES_USER}:${V_POSTGRES_PASSWORD}@${DB_HOST}:5432/${V_POSTGRES_DB}"
            echo "JWT_SECRET=${V_JWT_SECRET}"
            echo "GOOGLE_CLIENT_ID=${V_GOOGLE_CLIENT_ID}"
            echo "FRONTEND_URL=${V_FRONTEND_URL}"
            echo "AUTH_FROM_EMAIL=${V_AUTH_FROM_EMAIL}"
            echo "RESEND_API_KEY=${V_RESEND_API_KEY}"
            echo "NEXT_PUBLIC_SERVER_URL=${V_NEXT_PUBLIC_SERVER_URL}"
            echo "AWS_REGION=${V_AWS_REGION}"
            echo "AWS_ACCESS_KEY_ID=${V_AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${V_AWS_SECRET_ACCESS_KEY}"
            echo "S3_BUCKET_NAME=${V_S3_BUCKET_NAME}"
            echo "CDN_DOMAIN=${V_CDN_DOMAIN}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "COMPOSE_PROJECT_NAME=${APP_DIR}"
          } > /tmp/syncbeats.env

          if [ "${{ github.ref_name }}" != "main" ]; then
            # Strip postgres service and depends_on blocks from docker-compose for staging
            yq -i 'del(.services.postgres) | del(.services.server.depends_on) | del(.services.studio.depends_on)' docker-compose.yml
          fi

          # Ensure target dir exists and is writable
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/$APP_DIR && sudo chown -R \$USER:\$USER ~/$APP_DIR && rm -f ~/$APP_DIR/.env"

          # Upload .env
          scp -o StrictHostKeyChecking=yes \
            /tmp/syncbeats.env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/$APP_DIR/.env

          # Upload docker-compose.yml
          scp -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/$APP_DIR/docker-compose.yml

          # Dynamic VM Host Private IP Injection for Staging
          if [ "${{ github.ref_name }}" != "main" ]; then
            ssh -o StrictHostKeyChecking=yes \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
              "VM_IP=\$(hostname -I | awk '{print \$1}') && sed -i \"s/PLACEHOLDER_VM_IP/\$VM_IP/g\" ~/$APP_DIR/.env"
          fi

          # Lock down .env
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod 600 ~/$APP_DIR/.env"

          rm -f /tmp/syncbeats.env

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, provision-env]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull latest image
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker pull ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          ENDSSH

      - name: Start Postgres and wait until ready
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          # Source .env for POSTGRES_USER
          set -a; source .env; set +a

          docker compose --project-directory "$APP" down --remove-orphans || true

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker compose --project-directory "$APP" up -d postgres

            echo "Waiting for Postgres..."
            for i in $(seq 1 60); do
              if docker compose --project-directory "$APP" exec -T postgres pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; then
                echo "Postgres ready"
                break
              fi
              sleep 2
            done

            # Final check — fail hard if still not ready
            docker compose --project-directory "$APP" exec -T postgres pg_isready -U "$POSTGRES_USER" || {
              echo "Postgres failed to start"
              docker compose --project-directory "$APP" logs postgres
              exit 1
            }
          else
            echo "Staging deployment: skipping local postgres container startup and health checks."
          fi
          ENDSSH

      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi

          docker compose --project-directory "$APP" run --rm server npx prisma migrate deploy
          ENDSSH

      - name: Start server & studio and verify
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          # Source .env for PORT
          set -a; source .env; set +a

          docker compose --project-directory "$APP" up -d --force-recreate server studio

          echo "Waiting for backend on port $PORT..."
          BACKEND_OK=false
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1; then
              BACKEND_OK=true
              break
            fi
            sleep 3
          done

          if [ "$BACKEND_OK" = "false" ]; then
            echo "Backend health check failed"
            docker compose --project-directory "$APP" logs server
            exit 1
          fi

          echo "Backend healthy!"
          ENDSSH

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend, deploy-backend]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Start frontend and verify
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          # Source .env for FRONTEND_PORT
          set -a; source .env; set +a
          FPORT="${FRONTEND_PORT:-3000}"

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker pull ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}

          docker compose --project-directory "$APP" up -d --force-recreate frontend

          # Health check
          echo "Waiting for frontend on port $FPORT..."
          FRONT_OK=false
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${FPORT}" >/dev/null 2>&1; then
              FRONT_OK=true
              break
            fi
            sleep 3
          done

          if [ "$FRONT_OK" = "false" ]; then
            echo "Frontend health check failed"
            docker compose --project-directory "$APP" logs frontend
            exit 1
          fi

          echo "Frontend healthy!"
          ENDSSH

  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-frontend]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Reload nginx and cleanup
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          sudo nginx -t && sudo systemctl reload nginx
          # Prune old unused images to free disk space
          docker image prune -a -f --filter "until=1h"
          ENDSSH

      - name: Stop dev containers if deploying main
        if: github.ref_name == 'main'
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          if [ -d "$HOME/sync-beats-dev" ]; then
            echo "Tearing down dev environment..."
            docker compose --project-directory "$HOME/sync-beats-dev" down || true
            rm -rf "$HOME/sync-beats-dev"
          fi
          ENDSSH

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-backend, deploy-frontend]
    if: failure()
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Rollback backend
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi

          PREV=$(cat /tmp/syncbeats-prev-image.txt 2>/dev/null || echo "none")

          if [ "$PREV" != "none" ]; then
            docker compose --project-directory "$APP" down --remove-orphans || true
            docker tag "$PREV" ghcr.io/smanikanta21/syncbeats-server:${{ github.ref_name }}
            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose --project-directory "$APP" up -d postgres
            fi
            docker compose --project-directory "$APP" run --rm server npx prisma migrate deploy
            docker compose --project-directory "$APP" up -d server studio
          fi
          ENDSSH