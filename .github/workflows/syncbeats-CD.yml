name: Syncbeats CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smanikanta21/syncbeats-server

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build backend Docker image
  # Runs on GitHub's free runner (7GB RAM)
  # ─────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short   # e.g. ghcr.io/you/syncbeats-server:a1b2c3d
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./syncbeats-server   # path to your backend Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Cache layers between runs — dramatically speeds up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2 — Build Next.js frontend
  # Runs on GitHub's free runner (7GB RAM)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: npm run build

      # Package the build output to transfer to EC2
      # .next/standalone + .next/static + public is all you need
      - name: Package build output
        run: tar -czf frontend-build.tar.gz -C frontend .next public package.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy to EC2
  # Waits for both builds. EC2 does almost nothing.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, build-frontend]   # only runs if both succeed

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      # ── Download the frontend build from Job 2 ──
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      # ── SCP the pre-built frontend to EC2 ──
      - name: Upload frontend build to EC2
        run: |
          scp -o StrictHostKeyChecking=yes \
            frontend-build.tar.gz \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/frontend-build.tar.gz

      # ── Write .env to EC2 from GitHub Secrets ──
      - name: Create .env on EC2
        env:
          ENV_NODE_ENV: ${{ secrets.NODE_ENV }}
          ENV_PORT: ${{ secrets.PORT }}
          ENV_STUDIO_PORT: ${{ secrets.STUDIO_PORT }}
          ENV_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          ENV_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ENV_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ENV_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENV_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ENV_FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ENV_AUTH_FROM_EMAIL: ${{ secrets.AUTH_FROM_EMAIL }}
          ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Build the .env content locally, then SCP it
          # IMPORTANT: No indentation inside heredoc — leading spaces break .env parsing
          cat > /tmp/syncbeats.env <<EOF
          NODE_ENV=${ENV_NODE_ENV}
          PORT=${ENV_PORT}
          STUDIO_PORT=${ENV_STUDIO_PORT}
          POSTGRES_USER=${ENV_POSTGRES_USER}
          POSTGRES_PASSWORD=${ENV_POSTGRES_PASSWORD}
          POSTGRES_DB=${ENV_POSTGRES_DB}
          JWT_SECRET=${ENV_JWT_SECRET}
          GOOGLE_CLIENT_ID=${ENV_GOOGLE_CLIENT_ID}
          FRONTEND_URL=${ENV_FRONTEND_URL}
          AUTH_FROM_EMAIL=${ENV_AUTH_FROM_EMAIL}
          RESEND_API_KEY=${ENV_RESEND_API_KEY}
          EOF

          # Verify it's not empty
          echo "=== .env file has $(wc -l < /tmp/syncbeats.env) lines ==="

          # SCP to EC2
          scp -o StrictHostKeyChecking=yes \
            /tmp/syncbeats.env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/.env

          # Lock it down
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod 600 ~/sync-beats/.env"

          rm /tmp/syncbeats.env

      # ── Deploy on EC2 ──
      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"

            dc() { docker compose --project-directory "$APP" "$@"; }

            cd "$APP"
            git fetch origin
            git reset --hard origin/main

            # ── Verify .env is present ──────────────────────
            echo "=== .env check ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env file missing!"
              exit 1
            fi
            echo ".env exists with $(wc -l < .env) lines"
            # Print keys only (no values) for debugging
            echo "Keys present:"
            grep -oP '^[A-Z_]+(?==)' .env || echo "(no keys found)"

            # ── BACKEND ──────────────────────────────────────
            dc down --remove-orphans || true

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # ── Start Postgres first and wait for healthy ────
            echo "=== Starting Postgres ==="
            dc up -d postgres

            echo "Waiting for Postgres to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' sync-beats-postgres-1 2>/dev/null || echo "not-found")
              echo "  Attempt $i/30: postgres status = $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Postgres is healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: Postgres failed to become healthy after 30 attempts"
                echo "=== POSTGRES LOGS ==="
                dc logs --tail 100 postgres
                echo "=== POSTGRES CONTAINER INSPECT ==="
                docker inspect sync-beats-postgres-1 | grep -A 20 '"Health"'
                exit 1
              fi
              sleep 2
            done

            # ── Run migrations ───────────────────────────────
            echo "=== Running migrations ==="
            dc run --rm server npx prisma migrate deploy

            # ── Start all services ────────────────────────
            echo "=== Starting all services ==="
            dc up -d

            # Wait for backend to become healthy (retry up to 10 times)
            echo "Waiting for backend to become healthy..."
            BACKEND_PORT=$(grep '^PORT=' "$APP/.env" | cut -d= -f2)
            BACKEND_PORT=${BACKEND_PORT:-4000}
            BACKEND_HEALTHY=false

            for i in $(seq 1 10); do
              sleep 3
              if curl -fsS "http://localhost:${BACKEND_PORT}/health" >/dev/null 2>&1; then
                echo "  Attempt $i/10: Backend healthy ✓"
                BACKEND_HEALTHY=true
                break
              else
                echo "  Attempt $i/10: Backend not ready yet..."
              fi
            done

            echo "=== SERVER LOGS ==="
            dc logs --tail 50 server
            echo "=== CONTAINER STATUS ==="
            dc ps

            if [ "$BACKEND_HEALTHY" = "false" ]; then
              echo "ERROR: Backend failed health check after 10 attempts"
              echo "=== FULL SERVER LOGS ==="
              dc logs server
              echo "=== POSTGRES LOGS ==="
              dc logs postgres
              echo "=== CONTAINER INSPECT ==="
              docker inspect sync-beats-server-1 2>/dev/null | head -60 || true
              exit 1
            fi

            # ── FRONTEND ─────────────────────────────────────
            pm2 delete syncbeats-frontend || true

            cd "$FRONT"
            rm -rf .next public
            tar -xzf "$APP/frontend-build.tar.gz"
            rm "$APP/frontend-build.tar.gz"

            pm2 start "node .next/standalone/server.js" \
              --name syncbeats-frontend \
              --env PORT=3000
            pm2 save

            sleep 5
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend healthy ✓"
            else
              echo "WARNING: Frontend health check failed"
              pm2 logs syncbeats-frontend --lines 30 --nostream
            fi

            # ── NGINX ─────────────────────────────────────────
            sudo nginx -t
            sudo systemctl reload nginx

            # ── FINAL STATUS ─────────────────────────────────
            cd "$APP"
            echo "=== FINAL DOCKER STATUS ==="
            dc ps
            echo "=== FINAL SERVER LOGS ==="
            dc logs --tail 20 server
            echo "=== PM2 STATUS ==="
            pm2 ps

            echo "Deploy complete ✓"
          EOF