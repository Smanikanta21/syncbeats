name: Syncbeats CD (Cloud Run)

on:
  push:
    branches: [main, nodejs-dev]
    paths:
      - 'dev/syncbeats-server/**'
      - '.github/workflows/syncbeats-CD.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: sync-beats-472708
  REGION: asia-south1
  SERVICE_NAME: syncbeats-server
  GAR_REPO: asia-south1-docker.pkg.dev/sync-beats-472708/syncbeats-repo

jobs:
  test-backend:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp binary
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: ./dev/syncbeats-server
        run: |
          npm ci
          DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate

      - name: Execute Backend Tests
        working-directory: ./dev/syncbeats-server
        run: npm test

  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Service Name
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "SERVICE_NAME=syncbeats-server" >> $GITHUB_ENV
          else
            echo "SERVICE_NAME=syncbeats-server-staging" >> $GITHUB_ENV
          fi

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Docker Image
        working-directory: ./dev/syncbeats-server
        run: |
          IMAGE="${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Create Env JSON for Cloud Run
        env:
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://syncbeats.in' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_KEYS: ${{ secrets.RAPID_API_KEYS }}
          AUTH_FROM_EMAIL: ${{ vars.AUTH_FROM_EMAIL || 'auth@syncbeats.in' }}
          UPDATES_FROM_EMAIL: ${{ vars.UPDATES_FROM_EMAIL || 'updates@syncbeats.in' }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD || 'syncbeatsadmin' }}
        run: |
          jq -n '{NODE_ENV: env.NODE_ENV, FRONTEND_URL: env.FRONTEND_URL, DATABASE_URL: env.DATABASE_URL, JWT_SECRET: env.JWT_SECRET, GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET, SPOTIFY_CLIENT_ID: env.SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET: env.SPOTIFY_CLIENT_SECRET, RESEND_API_KEY: env.RESEND_API_KEY, RAPID_API_KEY: env.RAPID_API_KEY, RAPID_API_KEYS: env.RAPID_API_KEYS, AUTH_FROM_EMAIL: env.AUTH_FROM_EMAIL, UPDATES_FROM_EMAIL: env.UPDATES_FROM_EMAIL, ADMIN_PASSWORD: env.ADMIN_PASSWORD}' > env.json

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --max-instances 1 \
            --session-affinity \
            --env-vars-file env.json