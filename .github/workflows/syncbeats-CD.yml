name: Syncbeats CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smanikanta21/syncbeats-server

jobs:

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./syncbeats-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: npm run build

      - name: Package build output
        run: |
          cd frontend
          tar -czf ../frontend-build.tar.gz \
            .next/standalone \
            .next/static \
            public \
            package.json

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          retention-days: 1


  provision-env:
    name: Provision .env on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env and SCP to EC2
        env:
          V_NODE_ENV:          ${{ secrets.NODE_ENV }}
          V_PORT:              ${{ secrets.PORT }}
          V_STUDIO_PORT:       ${{ secrets.STUDIO_PORT }}
          V_POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          V_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          V_POSTGRES_DB:       ${{ secrets.POSTGRES_DB }}
          V_JWT_SECRET:        ${{ secrets.JWT_SECRET }}
          V_GOOGLE_CLIENT_ID:  ${{ secrets.GOOGLE_CLIENT_ID }}
          V_FRONTEND_URL:      ${{ secrets.FRONTEND_URL }}
          V_AUTH_FROM_EMAIL:   ${{ secrets.AUTH_FROM_EMAIL }}
          V_RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: |
          {
            echo "NODE_ENV=${V_NODE_ENV}"
            echo "PORT=${V_PORT}"
            echo "STUDIO_PORT=${V_STUDIO_PORT}"
            echo "POSTGRES_USER=${V_POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${V_POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${V_POSTGRES_DB}"
            echo "DATABASE_URL=postgresql://${V_POSTGRES_USER}:${V_POSTGRES_PASSWORD}@postgres:5432/${V_POSTGRES_DB}"
            echo "JWT_SECRET=${V_JWT_SECRET}"
            echo "GOOGLE_CLIENT_ID=${V_GOOGLE_CLIENT_ID}"
            echo "FRONTEND_URL=${V_FRONTEND_URL}"
            echo "AUTH_FROM_EMAIL=${V_AUTH_FROM_EMAIL}"
            echo "RESEND_API_KEY=${V_RESEND_API_KEY}"
          } > /tmp/syncbeats.env

          scp /tmp/syncbeats.env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/.env

          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod 600 ~/sync-beats/.env"

          rm /tmp/syncbeats.env


  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, provision-env]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail

          APP="$HOME/sync-beats"
          dc() { docker compose --project-directory "$APP" "$@"; }

          cd "$APP"
          git fetch origin
          git reset --hard origin/main

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

          dc down --remove-orphans || true
          dc up -d postgres

          for i in $(seq 1 60); do
            if docker exec sync-beats-postgres-1 pg_isready -U syncbeats >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          dc run --rm server npx prisma migrate deploy
          dc up -d server studio
          ENDSSH


  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend, deploy-backend]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Upload build
        run: |
          scp frontend-build.tar.gz \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/frontend-build.tar.gz

      - name: Deploy frontend with rollback
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail

          APP="$HOME/sync-beats"
          FRONT="$APP/frontend"
          BACKUP="$APP/frontend_backup"

          rm -rf "$BACKUP"
          cp -r "$FRONT" "$BACKUP" || true

          pm2 delete syncbeats-frontend || true

          cd "$FRONT"
          rm -rf .next public node_modules server.js

          tar -xzf "$APP/frontend-build.tar.gz"
          rm "$APP/frontend-build.tar.gz"

          mkdir -p .next/standalone/frontend/.next
          cp -r .next/static .next/standalone/frontend/.next/

          pm2 start ".next/standalone/frontend/server.js" \
            --name syncbeats-frontend \
            --env PORT=3000

          pm2 save

          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              rm -rf "$BACKUP"
              exit 0
            fi
            sleep 3
          done

          echo "Frontend failed, rolling back"

          pm2 delete syncbeats-frontend || true
          rm -rf "$FRONT"
          mv "$BACKUP" "$FRONT"

          pm2 start "$FRONT/.next/standalone/frontend/server.js" \
            --name syncbeats-frontend \
            --env PORT=3000

          pm2 save
          exit 1
          ENDSSH


  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    needs: [deploy-frontend]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Reload nginx
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo nginx -t && sudo systemctl reload nginx"