name: Syncbeats CD (VM Deployment)

on:
  push:
    branches: [main, nodejs-dev]
    paths:
      - 'dev/syncbeats-server/**'
      - '.github/workflows/syncbeats-CD.yml'
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: sync-beats-472708
  ZONE: us-central1-f
  VM_NAME: syncbeats-vm

jobs:
  teardown-staging:
    name: Teardown Staging on Merge
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'nodejs-dev' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Teardown Staging via SSH
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone ${{ env.ZONE }} --quiet --command="sudo COMPOSE_PROJECT_NAME=syncbeats-staging docker compose -f /home/abhinay/docker-compose.yml --env-file /home/abhinay/.env.syncbeats-staging down -v"

  test-backend:
    name: Run Backend Test Suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp binary
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: ./dev/syncbeats-server
        run: |
          npm ci
          DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate

      - name: Execute Backend Tests
        working-directory: ./dev/syncbeats-server
        run: npm test

  deploy:
    name: Build & Deploy to VM
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation
      packages: write   # Required to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dev/syncbeats-server
          push: true
          tags: |
            ghcr.io/smanikanta21/syncbeats-server:${{ github.ref_name }}-latest
            ghcr.io/smanikanta21/syncbeats-server:${{ github.sha }}

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref_name }}" == "nodejs-dev" ]; then
            echo "COMPOSE_PROJECT_NAME=syncbeats-staging" >> $GITHUB_ENV
            echo "PORT=4001" >> $GITHUB_ENV
            echo "DB_PORT=5433" >> $GITHUB_ENV
            echo "FRONTEND_PORT=3001" >> $GITHUB_ENV
            echo "STUDIO_PORT=5556" >> $GITHUB_ENV
            echo "ENV_POSTGRES_DB=syncbeats_staging" >> $GITHUB_ENV
            echo "BACKEND_URL=https://dev-api.syncbeats.app" >> $GITHUB_ENV
          else
            echo "COMPOSE_PROJECT_NAME=sync-beats" >> $GITHUB_ENV
            echo "PORT=4000" >> $GITHUB_ENV
            echo "DB_PORT=5432" >> $GITHUB_ENV
            echo "FRONTEND_PORT=3000" >> $GITHUB_ENV
            echo "STUDIO_PORT=5555" >> $GITHUB_ENV
            echo "ENV_POSTGRES_DB=${{ vars.POSTGRES_DB || 'syncbeats' }}" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ vars.BACKEND_URL || 'https://api.syncbeats.in' }}" >> $GITHUB_ENV
          fi

      - name: Create and Sync .env
        env:
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'syncbeats' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'syncbeats' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://syncbeats.in' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_KEYS: ${{ secrets.RAPID_API_KEYS }}
          AUTH_FROM_EMAIL: ${{ vars.AUTH_FROM_EMAIL || 'auth@syncbeats.in' }}
          UPDATES_FROM_EMAIL: ${{ vars.UPDATES_FROM_EMAIL || 'updates@syncbeats.in' }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD || 'syncbeatsadmin' }}
        run: |
          cat <<EOF > .env.vm
          COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME
          IMAGE_TAG=${{ github.ref_name }}-latest
          NODE_ENV=$NODE_ENV
          PORT=$PORT
          DB_PORT=$DB_PORT
          FRONTEND_PORT=$FRONTEND_PORT
          STUDIO_PORT=$STUDIO_PORT
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$ENV_POSTGRES_DB
          FRONTEND_URL=$FRONTEND_URL
          BACKEND_URL=$BACKEND_URL
          JWT_SECRET=$JWT_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET
          RESEND_API_KEY=$RESEND_API_KEY
          RAPID_API_KEY=$RAPID_API_KEY
          RAPID_API_KEYS=$RAPID_API_KEYS
          AUTH_FROM_EMAIL=$AUTH_FROM_EMAIL
          UPDATES_FROM_EMAIL=$UPDATES_FROM_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          EOF
          gcloud compute scp .env.vm ${{ env.VM_NAME }}:/tmp/.env.${COMPOSE_PROJECT_NAME} --zone ${{ env.ZONE }} --quiet
          gcloud compute scp docker-compose.yml ${{ env.VM_NAME }}:/home/abhinay/docker-compose.yml --zone ${{ env.ZONE }} --quiet

      - name: Deploy to VM via SSH
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone ${{ env.ZONE }} --quiet --command="sudo mv /tmp/.env.${COMPOSE_PROJECT_NAME} /home/abhinay/.env.${COMPOSE_PROJECT_NAME} && sudo fallocate -l 2G /swapfile || true && sudo chmod 600 /swapfile || true && sudo mkswap /swapfile || true && sudo swapon /swapfile || true && sudo COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} docker compose -f /home/abhinay/docker-compose.yml --env-file /home/abhinay/.env.${COMPOSE_PROJECT_NAME} pull server && sudo COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} docker compose -f /home/abhinay/docker-compose.yml --env-file /home/abhinay/.env.${COMPOSE_PROJECT_NAME} run --rm server npx prisma migrate deploy && sudo COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} docker compose -f /home/abhinay/docker-compose.yml --env-file /home/abhinay/.env.${COMPOSE_PROJECT_NAME} up -d server"