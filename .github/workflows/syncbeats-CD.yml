name: Syncbeats CD

on:
  push:
    branches: [main, nodejs-dev]
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: smanikanta21/syncbeats-server
  FRONTEND_IMAGE: smanikanta21/syncbeats-frontend
  ENVIRONMENT: ${{ github.ref_name }}

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./syncbeats-server
          push: true
          tags: |
            ghcr.io/${{ env.BACKEND_IMAGE }}:latest
            ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.FRONTEND_IMAGE }}:latest
            ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}

  provision-env:
    name: Provision .env on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
      - name: Write .env and SCP to EC2
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          STUDIO_PORT: ${{ vars.STUDIO_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          AUTH_FROM_EMAIL: ${{ vars.AUTH_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
        run: |
          {
            echo "NODE_ENV=$NODE_ENV"
            echo "PORT=$PORT"
            echo "STUDIO_PORT=$STUDIO_PORT"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "FRONTEND_URL=$FRONTEND_URL"
            echo "AUTH_FROM_EMAIL=$AUTH_FROM_EMAIL"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "NEXT_PUBLIC_SERVER_URL=$NEXT_PUBLIC_SERVER_URL"
          } > /tmp/syncbeats.env

          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/sync-beats"

          scp -o StrictHostKeyChecking=yes \
            /tmp/syncbeats.env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/.env

          scp -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/sync-beats/docker-compose.yml

          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod 400 ~/sync-beats/.env"

          rm /tmp/syncbeats.env

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, provision-env]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy backend
        env:
          PORT: ${{ vars.PORT }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<EOF
          set -euo pipefail
          APP="$HOME/sync-beats"
          dc() { docker compose --project-directory "$APP" "$@"; }
          cd "$APP"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          docker tag ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }} \
          ghcr.io/${{ env.BACKEND_IMAGE }}:latest
          dc down --remove-orphans || true
          dc up -d postgres
          sleep 10
          dc run --rm server npx prisma migrate deploy
          dc up -d server studio
          sleep 5
          curl -f http://localhost:${{ vars.PORT }}/health || exit 1
          EOF

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-frontend, deploy-backend]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy frontend
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<EOF
          set -euo pipefail
          APP="$HOME/sync-beats"
          dc() { docker compose --project-directory "$APP" "$@"; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          docker tag ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }} \
           ghcr.io/${{ env.FRONTEND_IMAGE }}:latest
          dc up -d frontend
          sleep 5
          curl -f http://localhost:3000 || exit 1
          EOF

  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    needs: [deploy-frontend]

    steps:
      - name: Reload nginx
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo nginx -t && sudo systemctl reload nginx"
