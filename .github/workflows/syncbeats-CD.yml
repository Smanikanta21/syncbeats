name: Syncbeats CD

on:
  push:
    branches: [main, nodejs-dev]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: smanikanta21/syncbeats-server
  FRONTEND_IMAGE: smanikanta21/syncbeats-frontend
  VISUALIZER_IMAGE: smanikanta21/syncbeats-db-visualizer

jobs:

  test-backend:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp binary
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: ./dev/syncbeats-server
        run: |
          npm ci
          DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate

      - name: Execute Backend Tests
        working-directory: ./dev/syncbeats-server
        run: npm test

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: test-backend
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v5
        with:
          context: ./dev/syncbeats-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  build-visualizer:
    name: Build DB Visualizer Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.VISUALIZER_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v5
        with:
          context: ./dev/db-visualizer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provision-env:
    name: Provision .env on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env and SCP to EC2
        env:
          V_NODE_ENV:              ${{ vars.NODE_ENV }}
          V_PORT:                  ${{ vars.PORT }}
          V_STUDIO_PORT:           ${{ vars.STUDIO_PORT }}
          V_FRONTEND_PORT:         ${{ vars.FRONTEND_PORT }}
          V_POSTGRES_USER:         ${{ vars.POSTGRES_USER }}
          V_POSTGRES_PASSWORD:     ${{ secrets.POSTGRES_PASSWORD }}
          V_POSTGRES_DB:           ${{ vars.POSTGRES_DB }}
          V_JWT_SECRET:            ${{ secrets.JWT_SECRET }}
          V_GOOGLE_CLIENT_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
          V_GOOGLE_CLIENT_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
          V_FRONTEND_URL:          ${{ vars.FRONTEND_URL }}
          V_BACKEND_URL:           ${{ vars.BACKEND_URL }}
          V_SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          V_SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          V_AUTH_FROM_EMAIL:       ${{ vars.AUTH_FROM_EMAIL }}
          V_RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          V_NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
          V_RAPID_API_KEY:         ${{ secrets.RAPID_API_KEY }}
          V_RAPID_API_KEYS:        ${{ secrets.RAPID_API_KEYS }}
        run: |
          APP_DIR="sync-beats"
          DB_HOST="postgres"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP_DIR="sync-beats-dev"
            DB_HOST="sync-beats-postgres-1"
          fi

          {
            echo "NODE_ENV=${V_NODE_ENV}"
            echo "PORT=${V_PORT}"
            echo "STUDIO_PORT=${V_STUDIO_PORT}"
            echo "FRONTEND_PORT=${V_FRONTEND_PORT}"
            echo "POSTGRES_USER=${V_POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${V_POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${V_POSTGRES_DB}"
            echo "DATABASE_URL=postgresql://${V_POSTGRES_USER}:${V_POSTGRES_PASSWORD}@${DB_HOST}:5432/${V_POSTGRES_DB}"
            echo "JWT_SECRET=${V_JWT_SECRET}"
            echo "GOOGLE_CLIENT_ID=${V_GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${V_GOOGLE_CLIENT_SECRET}"
            echo "FRONTEND_URL=${V_FRONTEND_URL}"
            echo "BACKEND_URL=${V_BACKEND_URL}"
            echo "SPOTIFY_CLIENT_ID=${V_SPOTIFY_CLIENT_ID}"
            echo "SPOTIFY_CLIENT_SECRET=${V_SPOTIFY_CLIENT_SECRET}"
            echo "AUTH_FROM_EMAIL=${V_AUTH_FROM_EMAIL}"
            echo "RESEND_API_KEY=${V_RESEND_API_KEY}"
            echo "NEXT_PUBLIC_SERVER_URL=${V_NEXT_PUBLIC_SERVER_URL}"
            echo "RAPID_API_KEY=${V_RAPID_API_KEY}"
            echo "RAPID_API_KEYS=${V_RAPID_API_KEYS}"
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "COMPOSE_PROJECT_NAME=${APP_DIR}"
          } > /tmp/syncbeats.env

          if [ "${{ github.ref_name }}" != "main" ]; then
            # Strip postgres service and depends_on blocks from docker-compose for staging
            # Attach server/studio to the shared prod network so they can reach the postgres container by name
            yq -i '
              del(.services.postgres) |
              del(.services.server.depends_on) |
              del(.services.visualizer.depends_on) |
              .services.server.networks = ["default", "prod_network"] |
              .services.visualizer.networks = ["default", "prod_network"] |
              .networks.prod_network.external = true |
              .networks.prod_network.name = "sync-beats_default"
            ' docker-compose.yml
          fi

          # Ensure target dir exists, is writable, and is clean of old files
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "mkdir -p ~/$APP_DIR && sudo chown -R \$USER:\$USER ~/$APP_DIR && rm -rf ~/$APP_DIR/* ~/$APP_DIR/.[!.]* ~/$APP_DIR/..?*" || true

          # Ensure a swapfile exists to prevent OOM crashes on micro instances
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          if [ $(free | awk '/^Swap:/ {print $2}') -eq 0 ]; then
            echo "No swap found. Creating a 2GB swapfile to prevent crashes..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            echo "Swap created successfully!"
          else
            echo "Swap already exists."
          fi
          ENDSSH

          # Upload .env
          scp -o StrictHostKeyChecking=yes \
            /tmp/syncbeats.env \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/$APP_DIR/.env

          # Upload docker-compose.yml
          scp -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/$APP_DIR/docker-compose.yml

          # No IP injection needed — staging uses shared prod Docker network to reach postgres by container name

          # Lock down .env
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "chmod 600 ~/$APP_DIR/.env"

          rm -f /tmp/syncbeats.env

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-backend, build-visualizer, provision-env]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull latest image
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

          IMAGE="ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}"

          # Save the current image digest BEFORE doing anything — needed for rollback
          PREV=$(docker inspect --format='{{.Id}}' "$IMAGE" 2>/dev/null || echo "none")
          echo "$PREV" > /tmp/syncbeats-prev-image.txt
          echo "Previous image saved: $PREV"

          # Pull the new images FIRST — if this fails, the old image is still intact
          docker pull "$IMAGE"
          docker pull "ghcr.io/${{ env.VISUALIZER_IMAGE }}:${{ github.ref_name }}"

          # Only prune dangling images (not all images, never volumes — that would wipe the DB!)
          docker image prune -f || true
          ENDSSH


      - name: Start Postgres and wait until ready
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          # Source .env for POSTGRES_USER
          set -a; source .env; set +a

          # Ensure the shared Docker network exists.
          # The staging compose file references sync-beats_default as external.
          # If it was deleted by a previous prune, all docker compose commands fail.
          docker network inspect sync-beats_default > /dev/null 2>&1 || \
            docker network create sync-beats_default || true

          # Bring down any running containers (ignore errors from stale/missing networks)
          docker compose --project-directory "$APP" down 2>/dev/null || true

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker compose --project-directory "$APP" up -d postgres

            echo "Waiting for Postgres..."
            for i in $(seq 1 60); do
              if docker compose --project-directory "$APP" exec -T postgres pg_isready -U "$POSTGRES_USER" > /dev/null 2>&1; then
                echo "Postgres ready"
                break
              fi
              sleep 2
            done

            # Final check — fail hard if still not ready
            docker compose --project-directory "$APP" exec -T postgres pg_isready -U "$POSTGRES_USER" || {
              echo "Postgres failed to start"
              docker compose --project-directory "$APP" logs postgres
              exit 1
            }
          else
            echo "Staging deployment: skipping local postgres container startup and health checks."
          fi
          ENDSSH


      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi

          docker compose --project-directory "$APP" run --rm server npx prisma migrate deploy
          ENDSSH

      - name: Start server & studio and verify
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi
          cd "$APP"

          # Source .env for PORT
          set -a; source .env; set +a

          docker compose --project-directory "$APP" up -d --force-recreate --remove-orphans server visualizer

          echo "Waiting for backend on port $PORT..."
          BACKEND_OK=false
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${PORT}/health" >/dev/null 2>&1; then
              BACKEND_OK=true
              break
            fi
            sleep 3
          done

          if [ "$BACKEND_OK" = "false" ]; then
            echo "Backend health check failed"
            docker compose --project-directory "$APP" logs server
            exit 1
          fi

          echo "Backend healthy!"
          ENDSSH



  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-backend]
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Reload nginx and cleanup
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          sudo nginx -t && sudo systemctl reload nginx
          # Prune old dangling images to free disk space safely without spiking CPU/RAM
          docker image prune -f
          ENDSSH

      - name: Stop dev containers if deploying main
        if: github.ref_name == 'main'
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          if [ -d "$HOME/sync-beats-dev" ]; then
            echo "Tearing down dev environment..."
            docker compose --project-directory "$HOME/sync-beats-dev" down || true
            rm -rf "$HOME/sync-beats-dev"
          fi
          ENDSSH

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-backend]
    if: failure() && github.ref_name == 'main'
    environment: ${{ github.ref_name }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Rollback backend
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
          set -euo pipefail
          APP="$HOME/sync-beats"
          if [ "${{ github.ref_name }}" != "main" ]; then
            APP="$HOME/sync-beats-dev"
          fi

          IMAGE="ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}"

          echo "=== Rollback: trying to restore last good image ==="

          # Try to retag from the saved digest (works if image wasn't fully pruned)
          PREV=$(cat /tmp/syncbeats-prev-image.txt 2>/dev/null || echo "none")
          if [ "$PREV" != "none" ] && [ "$PREV" != "" ] && docker image inspect "$PREV" > /dev/null 2>&1; then
            echo "Retagging previous local image $PREV"
            docker tag "$PREV" "$IMAGE"
          else
            echo "Local image not found — pulling last SHA-tagged image from GHCR"
            # List GHCR images and pull the most recent sha- tag as fallback
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pull the branch tag — if the new image broke, the registry tag still points to it
            # but this is better than nothing (prevents a completely dead server)
            docker pull "$IMAGE" || { echo "Cannot pull any image — manual intervention needed"; exit 1; }
          fi

          docker compose --project-directory "$APP" down --remove-orphans || true
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker compose --project-directory "$APP" up -d postgres
            sleep 5
          fi
          docker compose --project-directory "$APP" run --rm server npx prisma migrate deploy || true
          docker compose --project-directory "$APP" up -d server visualizer
          echo "=== Rollback complete ==="
          ENDSSH