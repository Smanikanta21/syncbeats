name: Package checks

on:
  pull_request:
    branches: [main, nodejs-dev]
  push:
    branches: [main, nodejs-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Check ${{ matrix.package }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ matrix.package == 'syncbeats-server' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncbeats_recommendations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syncbeats_recommendations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, syncbeats-server, db-visualizer]
    defaults:
      run:
        working-directory: dev/${{ matrix.package }}
    env:
      # These are disposable build values, not credentials for a real service.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/syncbeats_recommendations_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/syncbeats_recommendations_test
      JWT_SECRET: disposable-ci-value-with-no-deployment-access
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Unit/build checks do not execute provider downloads.
      YOUTUBE_DL_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        if: matrix.package != 'frontend'
        run: npx prisma generate
      - name: Lint (advisory while existing violations are resolved)
        if: matrix.package != 'syncbeats-server'
        continue-on-error: true
        run: npm run lint
      - run: npm run typecheck
      - name: Deployment database configuration
        if: matrix.package == 'syncbeats-server'
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Tests
        if: matrix.package != 'db-visualizer'
        run: npm test
      - name: Recommendation tests
        if: matrix.package == 'syncbeats-server'
        run: |
          npm run test:recommendations
          npx prisma migrate deploy
          npm run test:recommendation-api
      - run: npm run build
