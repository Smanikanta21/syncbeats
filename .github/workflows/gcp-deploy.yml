name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Fast Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Syncbeats
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"

            cd "$APP"

            echo "📥 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Restart backend"
            docker-compose up -d --build db prisma server

            echo "🩺 Backend check"
            curl -fsS http://localhost:4000/health >/dev/null

            echo "🎨 Build frontend"
            cd "$FRONT"
            rm -rf .next
            npm ci
            NEXT_PUBLIC_SERVER_URL=/api npm run build

            echo "🚀 Restart frontend"
            pm2 restart syncbeats-frontend --update-env || pm2 start npm --name syncbeats-frontend --cwd "$FRONT" -- start -- -p 3000
            pm2 save

            echo "🩺 Frontend check"
            curl -fsS http://localhost:3000 >/dev/null

            echo "🌐 Reload nginx"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ Deploy complete"
          EOF
