name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vm-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify Backend
        working-directory: syncbeats-server
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e

            cd ~/sync-beats

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🐳 Rebuilding backend containers..."
            docker-compose up -d --build db prisma server

            echo "🎨 Building frontend..."
            cd frontend
            npm ci
            npm run build

            echo "🚀 Restarting frontend with PM2..."
            pm2 restart syncbeats-frontend || pm2 start npm --name syncbeats-frontend -- start

            echo "💾 Saving PM2 state..."
            pm2 save

            echo "🔁 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment complete!"
          EOF