name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syncbeats-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            syncbeats-server/package-lock.json

      - name: Verify Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: |
          set -euxo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Verify Backend
        working-directory: syncbeats-server
        run: |
          set -euxo pipefail
          npm ci
          npm run build

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Setup SSH Key
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP_DIR="$HOME/sync-beats"
            FRONTEND_DIR="$APP_DIR/frontend"

            echo "📁 Enter project"
            cd "$APP_DIR"

            echo "📥 Sync latest code safely"
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "📌 Latest commit"
            git log --oneline -1

            echo "🐳 Stop any old frontend container if it exists"
            docker rm -f syncbeats-frontend || true
            docker rm -f sync-beats_frontend_1 || true

            echo "🐳 Build backend stack"
            docker-compose up -d --build db prisma server

            echo "⏳ Wait for backend health"
            sleep 10

            echo "🩺 Backend local probe"
            curl -fsS http://localhost:4000 || true

            echo "🎨 Build frontend cleanly"
            cd "$FRONTEND_DIR"
            rm -rf .next
            npm ci
            NEXT_PUBLIC_SERVER_URL=/api npm run build

            echo "🧹 Free port 3000 if occupied"
            sudo fuser -k 3000/tcp || true
            sleep 2

            echo "🚀 Restart frontend with PM2"
            pm2 delete syncbeats-frontend || true
            NEXT_PUBLIC_SERVER_URL=/api pm2 start npm \
              --name syncbeats-frontend \
              --cwd "$FRONTEND_DIR" \
              -- start -- -p 3000

            pm2 save

            echo "🩺 Frontend local probe"
            curl -fsS http://localhost:3000 > /dev/null

            echo "🔎 Validate Nginx config"
            sudo nginx -t

            echo "🔁 Reload Nginx"
            sudo systemctl reload nginx

            echo "🌐 HTTPS probe"
            curl -kfsS https://localhost > /dev/null || true

            echo "📊 PM2 Status"
            pm2 status

            echo "🐳 Docker Status"
            docker ps

            echo "✅ Deploy completed successfully"
          EOF