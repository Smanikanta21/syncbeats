# .github/workflows/deploy.yml
name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syncbeats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Clean Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Syncbeats
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"
            SERVER="$APP/syncbeats-server"

            cd "$APP"

            echo "📥 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🛑 Stop frontend PM2"
            pm2 delete syncbeats-frontend || true
            pm2 ps || true

            echo "🛑 Stop backend containers"
            docker compose down --remove-orphans || true

            echo "🧬 Prepare Prisma Client"
            cd "$SERVER"
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            echo "🐳 Start backend fresh"
            cd "$APP"
            docker compose up -d --build --remove-orphans server

            echo "🩺 Check backend"
            sleep 8
            curl -fsS http://localhost:4000/health >/dev/null

            echo "🎨 Build frontend"
            cd "$FRONT"
            rm -rf .next
            npm ci
            NEXT_PUBLIC_SERVER_URL=/api npm run build

            echo "🚀 Start frontend fresh"
            pm2 start "npm start -- -p 3000" --name syncbeats-frontend
            pm2 save

            echo "🩺 Check frontend"
            sleep 8
            curl -fsS http://localhost:3000 >/dev/null

            echo "🌐 Reload nginx"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "📊 Final PM2 Status"
            pm2 ps

            echo "🐳 Docker Status"
            docker ps

            echo "✅ Deploy complete"
          EOF