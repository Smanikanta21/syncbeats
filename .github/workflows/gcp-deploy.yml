name: Syncbeats CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: syncbeats-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            syncbeats-server/package-lock.json

      - name: Verify Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: |
          set -euxo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Verify Backend
        working-directory: syncbeats-server
        run: |
          set -euxo pipefail
          npm ci
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"

            cd "$APP"

            echo "📥 Sync code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Ensure backend stack"
            docker rm -f syncbeats-frontend || true
            docker rm -f sync-beats_frontend_1 || true
            docker-compose up -d --build db prisma server

            echo "⏳ Wait backend"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:4000/health >/dev/null; then
                echo "✅ Backend ready"
                break
              fi
              sleep 2
            done

            echo "🔌 Wait Socket.IO"
            for i in $(seq 1 30); do
              RESP="$(curl -fsS http://localhost:4000/socket.io/?EIO=4&transport=polling || true)"
              echo "$RESP" | grep -q '"sid"' && break
              sleep 2
            done

            echo "🎨 Build frontend"
            cd "$FRONT"
            rm -rf .next
            npm ci
            NEXT_PUBLIC_SERVER_URL=/api npm run build

            echo "📝 Write PM2 ecosystem"
            cat > ecosystem.config.js <<EOC
            module.exports = {
              apps: [{
                name: "syncbeats-frontend",
                cwd: "$FRONT",
                script: "npm",
                args: "start -- -p 3000",
                env: {
                  NODE_ENV: "production",
                  PORT: "3000",
                  NEXT_PUBLIC_SERVER_URL: "/api"
                }
              }]
            }
            EOC

            echo "🚀 Reload frontend idempotently"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

            echo "⏳ Wait frontend"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000 >/dev/null; then
                echo "✅ Frontend ready"
                break
              fi
              sleep 2
            done

            echo "🔎 Validate nginx"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "🌐 External check"
            curl -kfsS https://localhost >/dev/null || true

            echo "📊 PM2"
            pm2 restart syncbeats-frontend --update-env
            pm2 status
            pm2 save

            echo "🐳 Docker"
            docker ps

            echo "✅ Deploy successful"
          EOF
