name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syncbeats-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            syncbeats-server/package-lock.json

      - name: Verify Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: |
          set -euxo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Verify Backend
        working-directory: syncbeats-server
        run: |
          set -euxo pipefail
          npm ci
          npm run build

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Setup SSH
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            APP="$HOME/sync-beats"
            FRONT="$APP/frontend"

            cd "$APP"

            echo "📥 Sync latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Start backend containers"
            docker rm -f syncbeats-frontend || true
            docker rm -f sync-beats_frontend_1 || true
            docker-compose up -d --build db prisma server

            echo "🩺 Check backend health"
            curl -fsS http://localhost:4000/health >/dev/null

            echo "🎨 Build frontend"
            cd "$FRONT"
            rm -rf .next
            npm ci
            NEXT_PUBLIC_SERVER_URL=/api npm run build

            echo "📝 Create PM2 ecosystem file"
            cat > ecosystem.config.js <<EOC
            module.exports = {
              apps: [{
                name: "syncbeats-frontend",
                cwd: "$FRONT",
                script: "npm",
                args: "start -- -p 3000",
                env: {
                  NODE_ENV: "production",
                  PORT: "3000",
                  NEXT_PUBLIC_SERVER_URL: "/api"
                }
              }]
            }
            EOC

            echo "🚀 Reload frontend"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

            echo "🩺 Check frontend health"
            curl -fsS http://localhost:3000 >/dev/null

            echo "🔎 Reload nginx"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "🌐 Check HTTPS"
            curl -kfsS https://localhost >/dev/null || true

            echo "📊 PM2 Status"
            pm2 status

            echo "🐳 Docker Status"
            docker ps

            echo "✅ Deployment successful"
          EOF
