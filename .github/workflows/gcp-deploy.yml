name: Syncbeats CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syncbeats-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            syncbeats-server/package-lock.json

      - name: Verify Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SERVER_URL: /api
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify Backend
        working-directory: syncbeats-server
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -euxo pipefail

            echo "📁 Go to project"
            cd ~/sync-beats

            echo "📥 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Rebuild backend services"
            docker-compose up -d --build db prisma server

            echo "🧹 Remove old frontend build"
            cd ~/sync-beats/frontend
            rm -rf .next

            echo "📦 Install frontend deps"
            npm ci

            echo "🏗️ Build frontend"
            export NEXT_PUBLIC_SERVER_URL=/api
            npm run build

            echo "🛑 Free port 3000 if occupied"
            sudo fuser -k 3000/tcp || true

            echo "🚀 Restart frontend with PM2"
            pm2 delete syncbeats-frontend || true
            pm2 start npm --name syncbeats-frontend --cwd ~/sync-beats/frontend -- start
            pm2 save

            echo "🔁 Reload Nginx"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "📊 PM2 Status"
            pm2 status

            echo "✅ Deployment Successful"
          EOF