version: 2
# Pause routine version-update PRs to avoid recurring bot branches.
# This limit does not disable Dependabot security updates; those use a separate
# repository setting and can still create branches when enabled.
updates:
  - package-ecosystem: npm
    directory: /dev/frontend
    target-branch: nodejs-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /dev/syncbeats-server
    target-branch: nodejs-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /dev/db-visualizer
    target-branch: nodejs-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: nodejs-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
